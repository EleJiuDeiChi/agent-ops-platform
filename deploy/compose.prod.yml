name: agent-ops-prod

services:
  backend:
    image: ${AIOPS_BACKEND_IMAGE_REF:?set an immutable backend image digest reference}
    environment:
      AIOPS_ENV: prod
      AIOPS_BIND_HOST: 0.0.0.0
      AIOPS_DB_PATH: /app/data/aiops.sqlite
      AIOPS_SESSION_SECRET_FILE: /run/secrets/session_secret
      AIOPS_TRUSTED_ORIGINS: ${AIOPS_TRUSTED_ORIGINS:?set the production HTTPS origin}
      AIOPS_COOKIE_SECURE: "1"
      AIOPS_TLS_ENABLED: "1"
      AIOPS_DEBUG_SKIP_PASSWORD_CHANGE: "0"
      AIOPS_RELEASE_DIGEST: ${AIOPS_RELEASE_DIGEST:?set the immutable backend image/release digest}
      AIOPS_COMMIT_SHA: ${AIOPS_COMMIT_SHA:?set the reviewed release commit SHA}
      AIOPS_LLM_MODE: ${AIOPS_LLM_MODE:?set deepseek, moonshot, zhipu, or openai_compatible after provider review}
      AIOPS_LLM_ENABLED_PROVIDERS: ${AIOPS_LLM_ENABLED_PROVIDERS:?set exactly the selected provider after its independent live gate}
      AIOPS_LLM_BASE_URL: ${AIOPS_LLM_BASE_URL:?set the probed HTTPS OpenAI-compatible base URL}
      AIOPS_LLM_MODEL: ${AIOPS_LLM_MODEL:?set the exact model proven by the provider-specific discovery contract}
      AIOPS_LLM_API_KEY_FILE: /run/secrets/llm_api_key
      AIOPS_LLM_EVIDENCE_FILE: /run/secrets/llm_evidence
      AIOPS_LLM_EVIDENCE_SHA256: ${AIOPS_LLM_EVIDENCE_SHA256:?set the exact digest printed by probe-llm-contract.py}
    user: "10001:10001"
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0750
    volumes:
      - aiops_data:/app/data
    secrets:
      - session_secret
      - llm_api_key
      - llm_evidence
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - app_internal

  frontend:
    image: ${AIOPS_FRONTEND_IMAGE_REF:?set an immutable frontend image digest reference}
    depends_on:
      backend:
        condition: service_healthy
    user: "101:101"
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 15s
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101,mode=0750
    secrets:
      - tls_cert
      - tls_key
    ports:
      - "${AIOPS_HTTPS_BIND:-0.0.0.0}:${AIOPS_HTTPS_PORT:-443}:8443"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8443/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - app_internal

volumes:
  aiops_data:

networks:
  app_internal:
    driver: bridge

secrets:
  session_secret:
    file: ${AIOPS_SESSION_SECRET_FILE_HOST:?set a host path to the session secret file}
  llm_api_key:
    file: ${AIOPS_LLM_API_KEY_FILE_HOST:?set a host path to the LLM API key file}
  llm_evidence:
    file: ${AIOPS_LLM_EVIDENCE_FILE_HOST:?set the read-only live-provider evidence manifest}
  tls_cert:
    file: ${AIOPS_TLS_CERT_FILE_HOST:?set a host path to the TLS certificate}
  tls_key:
    file: ${AIOPS_TLS_KEY_FILE_HOST:?set a host path to the TLS private key}
