name: agent-ops-dev

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AIOPS_ENV: dev
      AIOPS_BIND_HOST: 0.0.0.0
      AIOPS_DB_PATH: /app/data/aiops.sqlite
      AIOPS_LLM_MODE: mock
      AIOPS_SESSION_SECRET: ${AIOPS_DEV_SESSION_SECRET:-local-dev-only-session-secret-change-me}
      AIOPS_BOOTSTRAP_ADMIN_PASSWORD: ${AIOPS_DEV_BOOTSTRAP_ADMIN_PASSWORD:-BootstrapPassword123!}
      AIOPS_TRUSTED_ORIGINS: ${AIOPS_DEV_TRUSTED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      AIOPS_COOKIE_SECURE: "0"
      AIOPS_TLS_ENABLED: "0"
      AIOPS_DEBUG_SKIP_PASSWORD_CHANGE: "1"
    init: true
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
